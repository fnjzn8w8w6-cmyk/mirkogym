<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Vulcan Lift — allenamento, dieta e coach" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vulcan Lift" />
    <script>
      // tema scelto (src/lib/theme.ts): applicato prima di mostrare la pagina, senza lampi di colore
      try {
        var t = localStorage.getItem('vl.theme');
        var bars = { carta: '#f2f2f2', grafite: '#0b0b0c' };
        if (t === 'carta' || t === 'grafite') {
          document.documentElement.setAttribute('data-theme', t);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bars[t]);
          if (t === 'carta') document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'default');
        }
      } catch (e) {}
    </script>
    <link rel="icon" href="/mirkogym/favicon.ico?v=vulcan1" sizes="any" />
    <link rel="apple-touch-icon" href="/mirkogym/apple-touch-icon.png?v=vulcan1" />
    <title>Vulcan Lift</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
