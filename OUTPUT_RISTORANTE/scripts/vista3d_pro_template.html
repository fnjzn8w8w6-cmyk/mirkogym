<style>
/* Presentazione: scena 3D a tutto schermo, pannelli scuri e discreti come in una sala la sera */
:root {
  --bg: #14110e;
  --panel: rgba(22, 19, 16, 0.78);
  --fg: #f3ece2;
  --muted: #b9ad9c;
  --line: rgba(243, 236, 226, 0.16);
  --accent: #d9a35b;           /* ottone */
  --accent-ink: #1b150f;
  --chip: rgba(255, 255, 255, 0.06);

  --font-ui: "Karla", "Helvetica Neue", Arial, sans-serif;

}
/* scelta deliberata: un solo aspetto scuro, come una sala la sera */
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
#scena { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
#scena:active { cursor: grabbing; }
.pannello { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2); }
#testa { top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; padding: 12px 16px 11px; max-width: 420px; }
#testa h1 { margin: 0; font: 600 25px/1.05 var(--font-display); letter-spacing: 0.01em; }
#testa h1 em { font-style: italic; font-weight: 500; color: var(--accent); }
#testa .riga { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
#piano { color: var(--fg); font-weight: 600; }
#barra { left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding: 8px; display: flex; gap: 6px; align-items: center; max-width: calc(100% - 32px); overflow-x: auto; scrollbar-width: none; }
#barra::-webkit-scrollbar { display: none; }
#barra .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 2px; flex: none; }
button { font: 500 12.5px var(--font-ui); color: var(--fg); background: var(--chip); border: 1px solid var(--line);
  border-radius: 7px; padding: 7px 11px; cursor: pointer; white-space: nowrap; flex: none; }
button:hover { border-color: var(--accent); }

button.primario { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
#punti { left: 16px; top: calc(118px + env(safe-area-inset-top, 0px)); padding: 10px; display: none; gap: 10px; width: 210px;
  max-height: calc(100vh - 210px); overflow-y: auto; }
#punti.aperto { display: grid; }
#punti .etichetta { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px 2px; }
#punti .gruppo { display: flex; flex-direction: column; gap: 5px; }
#punti .gruppo button { text-align: left; }
#mappa { right: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); padding: 8px; display: grid; gap: 4px; }
#mappa canvas { display: block; width: 176px; height: 214px; cursor: crosshair; }
#mappa .didascalia { font-size: 10.5px; color: var(--muted); text-align: center; }
#didascalia { left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); padding: 14px 20px;
  max-width: min(620px, calc(100% - 32px)); text-align: center; transition: opacity .5s; pointer-events: none; }
#didascalia h2 { margin: 0 0 4px; font: 600 24px/1.1 var(--font-display); }
#didascalia p { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--muted); text-wrap: pretty; }
#aiuto { left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 16px 20px; max-width: 330px; font-size: 13.5px;
  line-height: 1.5; text-align: center; pointer-events: none; transition: opacity .6s; }
#vignetta { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.38) 100%); }
#nero { position: fixed; inset: 0; pointer-events: none; background: #000; opacity: 0; }
#mirino { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%;
  background: rgba(255,255,255,.75); box-shadow: 0 0 0 1px rgba(0,0,0,.35); pointer-events: none; opacity: .7; }
#passi { position: fixed; right: 16px; display: none; flex-direction: column; gap: 8px; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
#passi button { width: 48px; height: 48px; font-size: 18px; padding: 0; background: var(--panel); }
#carico { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 9; transition: opacity .8s; }
#carico div { font: italic 500 22px var(--font-display); color: var(--muted); }
.nascosto { opacity: 0 !important; pointer-events: none !important; }
@media (max-width: 820px) {
  #punti.aperto { top: auto; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); left: 16px; right: 16px; width: auto; max-height: 46vh; }

  #mappa .didascalia { display: none; }

  #didascalia { bottom: calc(70px + env(safe-area-inset-bottom, 0px)); padding: 10px 14px; }
  #didascalia h2 { font-size: 19px; }
  #didascalia p { font-size: 12.5px; }
  #passi { display: flex; }
  #barra { left: 16px; right: 16px; transform: none; max-width: none; }
}
@media (prefers-reduced-motion: reduce) { #aiuto, #didascalia, #carico { transition: none; } }

<script>
'use strict';
const DATA = /*__DATA__*/null;
const EYE = 1.6;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const MOBILE = matchMedia('(max-width: 820px)').matches || /Mobi|Android/i.test(navigator.userAgent);

// ------------------------------------------------------------------ renderer
const canvas = document.getElementById('scena');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, MOBILE ? 1.5 : 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(68, 1, 0.05, 400);
const MAXANI = renderer.capabilities.getMaxAnisotropy();

let ENV = null; const ENVK = 0.32;
if (THREE.RoomEnvironment) {
  const pm = new THREE.PMREMGenerator(renderer);
  ENV = pm.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
  scene.environment = ENV;
}

// ------------------------------------------------------------------ utilita'
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function cnv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function tex(c, rep, srgb = true) {
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = Math.min(8, MAXANI);
  if (srgb) t.encoding = THREE.sRGBEncoding; if (rep) t.repeat.set(rep[0], rep[1]); return t;
}
// rumore morbido: piu' ottave di griglie casuali ingrandite
function noise(ctx, w, h, R, alpha, octaves, dark = '0,0,0', light = '255,255,255') {
  for (let o = 0; o < octaves.length; o++) {
    const n = octaves[o]; const [c, x] = cnv(n, n);
    const im = x.createImageData(n, n);
    for (let i = 0; i < n * n; i++) { const v = R(); const on = v > 0.5; const a = Math.abs(v - 0.5) * 2 * 255;
      const [r, g, b] = (on ? light : dark).split(',').map(Number); im.data.set([r, g, b, a], i * 4); }
    x.putImageData(im, 0, 0);
    ctx.save(); ctx.globalAlpha = alpha[o]; ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    // disegno ripetuto 3x3 per rendere il rumore piastrellabile
    for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) ctx.drawImage(c, i * w, j * h, w, h);
    ctx.restore();
  }
}

// ------------------------------------------------------------------ texture procedurali
function texSpina() {   // parquet a spina ungherese, rovere caldo: tessera 1,28 x 1,28 m
  const N = 1024, S = 128, px = N / S; const [c, x] = cnv(N, N); const im = x.createImageData(N, N); const R = rng(7);
  const cols = 4, W = S / cols, P = 12.8; const tone = []; for (let i = 0; i < 400; i++) tone.push([R(), R(), R()]);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const X = i / px, Y = j / px; const cI = Math.floor(X / W); const xl = X - cI * W; const s = cI % 2 ? -1 : 1;
    const t = Y + s * (s > 0 ? xl : xl - W); const k = Math.floor(t / P); const fr = t / P - k;
    const id = ((cI * 37 + ((k % 10) + 10) % 10 * 11) % 400 + 400) % 400; const [a, b, g] = tone[id];
    const along = (xl * 0.7071 - s * Y * 0.7071);
    const grain = Math.sin((fr * 9 + Math.sin(along * 0.35 + a * 20) * 0.6 + b * 6) * Math.PI) * 0.5 + 0.5;
    let L = 0.78 + a * 0.22 - grain * 0.08 - Math.pow(Math.sin(along * 0.9 + g * 7) * 0.5 + 0.5, 6) * 0.06;
    const edge = Math.min(fr, 1 - fr) * P < 0.18 || xl < 0.15 || W - xl < 0.15; if (edge) L *= 0.55;
    const o = (j * N + i) * 4;
    im.data[o] = 172 * L + 10 * b; im.data[o + 1] = 124 * L + 4 * g; im.data[o + 2] = 78 * L; im.data[o + 3] = 255;

}
function texPiastrelle(size, tile, base, vary, grout, seed, groutW = 0.5) {   // piastrelle quadrate (cotto, gres)
  const N = 1024, px = N / size; const [c, x] = cnv(N, N); const R = rng(seed);
  x.fillStyle = grout; x.fillRect(0, 0, N, N);
  const n = Math.round(size / tile);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const v = (R() - 0.5) * vary; const [r, g, b] = base;
    x.fillStyle = `rgb(${r * (1 + v) | 0},${g * (1 + v * 0.9) | 0},${b * (1 + v * 0.8) | 0})`;
    x.fillRect(i * tile * px + groutW * px / 2, j * tile * px + groutW * px / 2, tile * px - groutW * px, tile * px - groutW * px);
  }
  noise(x, N, N, R, [0.10, 0.07, 0.05], [8, 32, 128]);
  return c;
}
function texIntonaco(base, seed, strength = 1) {
  const N = 512; const [c, x] = cnv(N, N); const R = rng(seed);
  x.fillStyle = base; x.fillRect(0, 0, N, N);
  noise(x, N, N, R, [0.06 * strength, 0.05 * strength, 0.035 * strength], [4, 16, 96]);
  return c;
}
function texBoiserie() {   // boiserie verde scuro: pannello 60 cm, fascia 0-105 cm con battiscopa
  const W = 512, Hh = 896; const [c, x] = cnv(W, Hh); const R = rng(11);
  const g = x.createLinearGradient(0, 0, 0, Hh); g.addColorStop(0, '#2f4a3b'); g.addColorStop(1, '#263e31');
  x.fillStyle = g; x.fillRect(0, 0, W, Hh);
  const k = Hh / 105;    // px per cm
  // battiscopa
  x.fillStyle = '#1d3026'; x.fillRect(0, Hh - 11 * k, W, 11 * k);
  x.fillStyle = 'rgba(255,255,255,0.08)'; x.fillRect(0, Hh - 11 * k, W, 2);
  // pannello con cornice in rilievo
  const m = 7 * k, top = 12 * k, bot = Hh - 18 * k;
  x.strokeStyle = 'rgba(0,0,0,0.35)'; x.lineWidth = 5; x.strokeRect(m, top, W - 2 * m, bot - top);
  x.strokeStyle = 'rgba(255,255,255,0.10)'; x.lineWidth = 3; x.strokeRect(m + 6, top + 6, W - 2 * m - 12, bot - top - 12);
  x.strokeStyle = 'rgba(0,0,0,0.25)'; x.lineWidth = 2; x.strokeRect(m + 12, top + 12, W - 2 * m - 24, bot - top - 24);
  x.fillStyle = 'rgba(255,255,255,0.05)'; x.fillRect(0, 0, W, 5 * k);
  noise(x, W, Hh, R, [0.05, 0.04], [8, 64]);
  return c;
}
function texMattoni() {   // mattoni a vista (25x5,5 + giunto 1 cm), tessera 104 x 104 cm, leggera scialbatura
  const N = 1024, S = 104, px = N / S; const [c, x] = cnv(N, N); const R = rng(23);
  x.fillStyle = '#b9ab98'; x.fillRect(0, 0, N, N);
  noise(x, N, N, R, [0.25], [64]);
  const bw = 25, bh = 5.5, j = 1;
  for (let row = 0; row < 16; row++) {
    const off = row % 2 ? (bw + j) / 2 : 0;
    for (let col = -1; col < 5; col++) {
      const X = (col * (bw + j) + off) * px, Y = row * (bh + j) * px;
      const v = R(); const hue = [[146, 84, 62], [160, 100, 74], [122, 74, 56], [170, 118, 88], [136, 92, 72], [112, 82, 68]][Math.floor(R() * 6)];
      const f = 0.82 + v * 0.3;
      x.fillStyle = `rgb(${hue[0] * f | 0},${hue[1] * f | 0},${hue[2] * f | 0})`;
      x.beginPath(); x.roundRect ? x.roundRect(X + 0.5 * px, Y + 0.5 * px, bw * px, bh * px, 3) : x.rect(X + 0.5 * px, Y + 0.5 * px, bw * px, bh * px); x.fill();
      if (R() < 0.5) { x.fillStyle = `rgba(235,226,212,${0.15 + R() * 0.25})`; x.fillRect(X + px, Y + px, bw * px * R(), bh * px * 0.8); }
    }
  }
  noise(x, N, N, R, [0.10, 0.10, 0.06], [16, 64, 256]);
  return c;
}
function texMetro() {   // piastrelle diamantate bianche 7,5 x 15 per la cucina, tessera 60 x 60
  const N = 512, S = 60, px = N / S; const [c, x] = cnv(N, N); const R = rng(5);
  x.fillStyle = '#c9c6bf'; x.fillRect(0, 0, N, N);
  for (let r = 0; r < 8; r++) for (let k = -1; k < 5; k++) {
    const X = (k * 15 + (r % 2 ? 7.5 : 0)) * px, Y = r * 7.5 * px;
    const g = x.createLinearGradient(0, Y, 0, Y + 7.5 * px); const v = 242 + R() * 8;
    g.addColorStop(0, `rgb(${v},${v},${v - 3})`); g.addColorStop(1, `rgb(${v - 14},${v - 14},${v - 16})`);
    x.fillStyle = g; x.fillRect(X + 2, Y + 2, 15 * px - 4, 7.5 * px - 4);
  }
  return c;
}
function texNoce(seed = 3, light = false) {   // noce a fibra diritta: venature lungo u, tavole con tono diverso
  const N = 512; const [c, x] = cnv(N, N); const im = x.createImageData(N, N); const R = rng(seed);
  const base = light ? [124, 84, 56] : [88, 58, 39];
  const fr = [], ph = []; for (let k = 0; k < 7; k++) { fr.push(20 + R() * 140); ph.push(R() * 6.28); }
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const u = i / N, v = j / N;
    const w = v + Math.sin(u * 6.283 + ph[0]) * 0.006 + Math.sin(u * 6.283 * 3 + ph[1]) * 0.002;
    let g = 0; for (let k = 0; k < 7; k++) g += Math.sin(w * fr[k] * 6.283 / 4 + ph[k]) / (k + 1.5);
    const streak = Math.pow(Math.abs(Math.sin(w * 6.283 * 9 + Math.sin(u * 12.566 + ph[2]) * 0.3)), 18);
    const L = 1 + g * 0.05 - streak * 0.16 + Math.sin(w * 6.283 * 2 + ph[3]) * 0.05;
    const o = (j * N + i) * 4; im.data[o] = base[0] * L; im.data[o + 1] = base[1] * L; im.data[o + 2] = base[2] * L; im.data[o + 3] = 255;
  }
  x.putImageData(im, 0, 0); noise(x, N, N, R, [0.05], [64], '40,20,10', '255,230,200'); return c;
}
function texMarmo() {   // marmo bianco con venature grigie
  const N = 512; const [c, x] = cnv(N, N); const R = rng(9);
  x.fillStyle = '#ebe8e2'; x.fillRect(0, 0, N, N); noise(x, N, N, R, [0.06, 0.05], [6, 40], '120,118,112', '255,255,255');
  for (let k = 0; k < 9; k++) {
    x.beginPath(); let px = R() * N, py = R() * N; x.moveTo(px, py);
    for (let s = 0; s < 40; s++) { px += 14 + R() * 8; py += (R() - 0.5) * 26; x.lineTo(px, py); }

  }

}
function texPaglia() {   // paglia di Vienna per le sedute
  const N = 256; const [c, x] = cnv(N, N);
  x.fillStyle = '#5a4126'; x.fillRect(0, 0, N, N);
  x.strokeStyle = '#d9bf8a'; x.lineWidth = 3.2;
  for (let k = -N; k < 2 * N; k += 16) {
    for (const [dx, dy] of [[1, 0], [0, 1], [1, 1], [1, -1]]) {
      x.beginPath(); if (dx && !dy) { x.moveTo(0, k); x.lineTo(N, k); } else if (!dx) { x.moveTo(k, 0); x.lineTo(k, N); }
      else { x.moveTo(k, 0); x.lineTo(k + dy * N, N * 1); }

  x.globalAlpha = 1; x.fillStyle = '#4a3420';
  for (let i = 8; i < N; i += 16) for (let j = 8; j < N; j += 16) { x.beginPath(); x.arc(i, j, 3.4, 0, 6.29); x.fill(); }

function texDoghe() {   // rivestimento a doghe verticali in noce (montacarichi)
  const [c, x] = cnv(256, 512); x.save(); x.translate(256, 0); x.rotate(Math.PI / 2); x.drawImage(texNoce(17), 0, 0, 512, 256); x.restore();
  for (let i = 0; i < 256; i += 32) { x.fillStyle = 'rgba(0,0,0,0.45)'; x.fillRect(i, 0, 2, 512); x.fillStyle = 'rgba(255,255,255,0.08)'; x.fillRect(i + 2, 0, 1, 512); }
  return c;
}
function texCannettato() {   // pannello cannettato (banco cassa): listelli tondi da 2 cm
  const [c, x] = cnv(512, 256); x.save(); x.translate(512, 0); x.rotate(Math.PI / 2); x.drawImage(texNoce(29), 0, 0, 256, 512); x.restore();
  for (let i = 0; i < 512; i += 16) { const g = x.createLinearGradient(i, 0, i + 16, 0);
    g.addColorStop(0, 'rgba(0,0,0,0.35)'); g.addColorStop(0.4, 'rgba(255,230,200,0.10)'); g.addColorStop(0.75, 'rgba(0,0,0,0.05)'); g.addColorStop(1, 'rgba(0,0,0,0.38)');
    x.fillStyle = g; x.fillRect(i, 0, 16, 256); }

      for (const [a, b, mk] of bands) {
        if (b - a < 0.001) continue;

        const P = (xx, yy, zz) => V3(xx + nx * o, yy + ny * o, zz);

function campionaTour(fps = 30, v = 0.75) {
  // il percorso e' diviso in sequenze dagli stacchi (cut): tra una sequenza e l'altra dissolvenza al nero
  const seqs = [[]]; TOUR.forEach((w, i) => { if (w.cut) seqs.push([]); seqs[seqs.length - 1].push(i); });
  const out = { fps, pos: [], dir: [], cap: [], fade: [], didascalie: TOUR.map(w => w.t ? { t: w.t, c: w.c } : null) };
  const dt = 1 / fps; let curCap = 0, d = null;
  seqs.forEach((idx, si) => {
    const W = idx.map(i => TOUR[i]), n = W.length, SUB = 60;
    const curve = new THREE.CatmullRomCurve3(W.map(w => new THREE.Vector3(w.p[0], w.p[2] + EYE, w.p[1])), false, 'centripetal', 0.5);
    const P = [], S = [0]; for (let k = 0; k <= (n - 1) * SUB; k++) P.push(curve.getPoint(k / ((n - 1) * SUB)));
    for (let k = 1; k < P.length; k++) S.push(S[k - 1] + P[k].distanceTo(P[k - 1]));
    const sw = W.map((_, i) => S[i * SUB]);
    const look = W.map(w => w.look ? new THREE.Vector3(w.look[0], w.look[2], w.look[1]) : null);
    for (let i = 0; i < n; i++) if (!look[i]) { let a = i - 1, b = i + 1; while (!look[b]) b++; const f = (sw[i] - sw[a]) / (sw[b] - sw[a]); look[i] = look[a].clone().lerp(look[b], f); }
    const start = out.pos.length; if (si > 0) d = null;
    const push = (sArc) => {
      let k = 1; while (k < S.length - 1 && S[k] < sArc) k++;
      const f = (sArc - S[k - 1]) / Math.max(1e-6, S[k] - S[k - 1]); const p = P[k - 1].clone().lerp(P[k], f);
      let i = 0; while (i < n - 2 && sw[i + 1] < sArc) i++;
      const u = Math.min(1, Math.max(0, (sArc - sw[i]) / Math.max(1e-6, sw[i + 1] - sw[i]))); const e = u * u * (3 - 2 * u);
      const want = look[i].clone().lerp(look[i + 1], e).sub(p).normalize();
      d = d ? d.lerp(want, 1 - Math.exp(-dt * 3.2)).normalize() : want;
      out.pos.push([+p.x.toFixed(4), +p.y.toFixed(4), +p.z.toFixed(4)]); out.dir.push([+d.x.toFixed(4), +d.y.toFixed(4), +d.z.toFixed(4)]);
      out.cap.push(curCap); out.fade.push(0);
    };
    const stops = [0]; for (let i = 1; i < n - 1; i++) if (W[i].hold) stops.push(i); stops.push(n - 1);
    for (let j = 0; j < stops.length - 1; j++) {
      const a = stops[j], b = stops[j + 1];
      if (W[a].t) curCap = idx[a];
      for (let t = 0; t < (W[a].hold || 0); t += dt) push(sw[a]);
      const len = sw[b] - sw[a], ramp = 1.2, T = len / v + ramp;
      for (let t = 0; t < T; t += dt) {   // profilo trapezoidale: accelera, velocita' costante, rallenta
        let s2;
        if (t < ramp) s2 = v * t * t / (2 * ramp);
        else if (t > T - ramp) { const r = T - t; s2 = len - v * r * r / (2 * ramp); }
        else s2 = v * ramp / 2 + v * (t - ramp);
        push(sw[a] + Math.min(len, s2));
      }
    }
    if (W[n - 1].t) curCap = idx[n - 1];
    for (let t = 0; t < (W[n - 1].hold || 0); t += dt) push(sw[n - 1]);
    // dissolvenze di 0,7 s alle estremita' degli stacchi
    const nf = Math.round(0.7 * fps), end = out.pos.length;
    if (si > 0) for (let k = 0; k < nf; k++) out.fade[start + k] = 1 - k / nf;
    if (si < seqs.length - 1) for (let k = 0; k < nf; k++) out.fade[end - 1 - k] = Math.max(out.fade[end - 1 - k], 1 - k / nf);
  });
  return out;
}
let tour = null, TOURCAMP = null;
function avviaTour() {

}
function passoTour(now) {
  const C = TOURCAMP, x = (now - tour.t0) / 1000 * C.fps; const i = Math.floor(x);
  if (i >= C.pos.length - 1) { fermaTour(); return; }
  const f = x - i, a = C.pos[i], b = C.pos[i + 1], da = C.dir[i], db = C.dir[i + 1];
  pos.set(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f);
  const dx = da[0] + (db[0] - da[0]) * f, dy = da[1] + (db[1] - da[1]) * f, dz = da[2] + (db[2] - da[2]) * f;
  yaw = Math.atan2(dz, dx); pitch = Math.atan2(dy, Math.hypot(dx, dz));

}
function fermaTour() {

const mini = document.getElementById('mini'), mctx = mini.getContext('2d');
const BB = { x0: 20.3, x1: 27.4, y0: -0.6, y1: 13.6 };
const SC = Math.min(mini.width / (BB.x1 - BB.x0), mini.height / (BB.y1 - BB.y0));
const m2c = (x, y) => [(x - BB.x0) * SC + (mini.width - (BB.x1 - BB.x0) * SC) / 2, (y - BB.y0) * SC + (mini.height - (BB.y1 - BB.y0) * SC) / 2];
const c2m = (cx, cy) => [(cx - (mini.width - (BB.x1 - BB.x0) * SC) / 2) / SC + BB.x0, (cy - (mini.height - (BB.y1 - BB.y0) * SC) / 2) / SC + BB.y0];

function drawMini() {
  const f = DATA.floors[curFloor()];

  mctx.fillStyle = 'rgba(217,163,91,0.10)';
  for (const r of f.sala) { mctx.beginPath(); r.outer.forEach((p, i) => { const q = m2c(p[0], p[1]); i ? mctx.lineTo(q[0], q[1]) : mctx.moveTo(q[0], q[1]); }); mctx.fill(); }

  mctx.stroke();
  mctx.strokeStyle = '#7fb0c4'; mctx.lineWidth = 2; mctx.beginPath();
  for (const [x1, y1, x2, y2] of f.glass) { const a = m2c(x1, y1), b = m2c(x2, y2); mctx.moveTo(a[0], a[1]); mctx.lineTo(b[0], b[1]); }
  mctx.stroke();
  mctx.fillStyle = '#b8875a';
  for (const [x0, y0, x1, y1] of f.tables) { const a = m2c(x0, y0), b = m2c(x1, y1); mctx.fillRect(a[0], a[1], b[0] - a[0], b[1] - a[1]); }
  mctx.fillStyle = '#c2417f'; { const [x0, y0, x1, y1] = DATA.mc; const a = m2c(x0, y0), b = m2c(x1, y1); mctx.fillRect(a[0], a[1], b[0] - a[0], b[1] - a[1]); }

  const a = plastico ? orbit.az + Math.PI : yaw; mctx.arc(p[0], p[1], 36, a - 0.6, a + 0.6); mctx.closePath(); mctx.fill(); mctx.globalAlpha = 1;

}
